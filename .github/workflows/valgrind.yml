name: Valgrind

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/valgrind.yml'
  pull_request:
    branches: [ master ]

jobs:
  valgrind:
    name: Run Valgrind
    runs-on: ubuntu-latest
    permissions:
      actions:         read
      contents:        read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake valgrind \
                                  pkg-config libcurl4-openssl-dev libuv1-dev \
                                  libgtest-dev nlohmann-json3-dev rapidjson-dev

      - name: Build
        run: |
            cmake -B         build/  -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
            cmake --build    build/

      - name: Run Httpbun
        run: |
          sudo apt-get install --yes mkcert libnss3-tools
          mkcert -install
          mkcert -cert-file '/tmp/cert.pem' -key-file '/tmp/key.pem' httpbun.com
          echo '127.0.0.1 httpbun.com' | sudo tee --append /etc/hosts
          docker run \
            --name httpbun \
            --detach \
            --publish 443:443 \
            --volume /tmp:/tmp:ro \
            --env HTTPBUN_TLS_CERT=/tmp/cert.pem \
            --env HTTPBUN_TLS_KEY=/tmp/key.pem \
            --pull always \
            sharat87/httpbun
          sleep 1

      - name: Run Valgrind
        run: |
            ctest --test-dir build/ -T memcheck --output-on-failure
