name: Coverage

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [ master ]

jobs:
  coverage:
    name: Build coverage
    runs-on: ubuntu-latest
    permissions:
      actions:         read
      contents:        read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake lcov \
                                  pkg-config libcurl4-openssl-dev libuv1-dev \
                                  libgtest-dev nlohmann-json3-dev rapidjson-dev

      - name: Build
        run: |
          cmake -B         build/  -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build    build/

      - name: Run Httpbun
        run: |
          sudo apt-get install --yes mkcert libnss3-tools
          mkcert -install
          mkcert -cert-file '/tmp/cert.pem' -key-file '/tmp/key.pem' httpbun.com
          echo '127.0.0.1 httpbun.com' | sudo tee --append /etc/hosts
          docker run \
            --name httpbun \
            --detach \
            --publish 443:443 \
            --volume /tmp:/tmp:ro \
            --env HTTPBUN_TLS_CERT=/tmp/cert.pem \
            --env HTTPBUN_TLS_KEY=/tmp/key.pem \
            --pull always \
            sharat87/httpbun
          sleep 1

      - name: Test and coverage
        run: |
          ctest --test-dir build/ -T test -T coverage --output-on-failure
          lcov --capture \
               --directory build/src/ \
               --include '*/curlev/src/*' --include '*/curlev/include/*' \
               --exclude='*/curlev/include/wrapper.hpp' \
               --output-file build/coverage.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          files:          build/coverage.info
          disable_search: true
          flags:          unittests
